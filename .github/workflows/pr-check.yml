name: PR check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lockfile:
    name: lockfile-frozen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: bun install --frozen-lockfile
        # --ignore-scripts skips postinstall steps (e.g. @vscode/ripgrep
        # downloading a release binary), which hit rate limits / 403s in CI.
        # We only need to verify the lockfile is consistent with package.json.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile --ignore-scripts

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
