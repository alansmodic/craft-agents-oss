name: Sync upstream

# Keeps this fork current with craft-ai-agents/craft-agents-oss.
# Strategy: merge upstream and push the result STRAIGHT TO main using the
# built-in GITHUB_TOKEN (contents:write). No pull request is created, because
# the default token cannot create PRs on this repo and a PAT would be extra
# setup. Lockfile-only conflicts are auto-resolved from upstream (this fork
# does not modify package.json, so upstream's bun.lock is always correct).
# Genuine conflicts are pushed to a sync/* branch and the job fails loudly so
# the maintainer is notified to resolve them by hand.

on:
  schedule:
    - cron: '17 6 * * 1'   # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/craft-ai-agents/craft-agents-oss.git
  UPSTREAM_BRANCH: main
  # On conflict, take the upstream copy of these files verbatim.
  AUTO_RESOLVE_THEIRS: bun.lock

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Check if already up to date
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/$UPSTREAM_BRANCH)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" = "0" ]; then
            echo "✅ Fork is already up to date with upstream."
          else
            echo "Fork is behind upstream by $BEHIND commit(s)."
          fi

      - name: Merge upstream and push to main
        if: steps.check.outputs.behind != '0'
        run: |
          set -euo pipefail

          # Merge directly on the checked-out main branch.
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "Clean merge."
          else
            echo "Merge produced conflicts; attempting to auto-resolve known lockfiles."
            for f in $AUTO_RESOLVE_THEIRS; do
              if git diff --name-only --diff-filter=U | grep -qx "$f"; then
                echo "Auto-resolving $f from upstream."
                git checkout "upstream/$UPSTREAM_BRANCH" -- "$f"
                git add "$f"
              fi
            done

            REMAINING="$(git diff --name-only --diff-filter=U || true)"
            if [ -n "$REMAINING" ]; then
              echo "::warning::Unresolved conflicts remain — routing to a manual-merge branch."
              echo "$REMAINING"
              BRANCH="sync/upstream-$(date -u +%Y%m%d-%H%M%S)"
              git add -A
              git commit --no-verify -m "WIP: merge upstream/$UPSTREAM_BRANCH (conflicts)"
              git branch "$BRANCH"
              git push origin "HEAD:refs/heads/$BRANCH"
              echo "::error::Upstream sync hit conflicts in: $REMAINING. A branch '$BRANCH' was pushed with conflict markers. Resolve it locally, then merge into main."
              exit 1
            fi

            git commit --no-edit
            echo "Conflicts auto-resolved."
          fi

          git push origin HEAD:main
          echo "✅ Synced ${{ steps.check.outputs.behind }} upstream commit(s) to main."
